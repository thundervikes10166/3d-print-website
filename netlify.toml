[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Pin Node so Netlify builds match Codespaces and local builds.
[build.environment]
  NODE_VERSION = "22"

# Existing React/Vite single-page routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
